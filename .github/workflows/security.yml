name: Security Audit

on:
  schedule:
    - cron: '0 2 * * 0'  # Weekly on Sunday 2 AM UTC
  workflow_dispatch:
    inputs:
      depth:
        description: 'Audit depth'
        required: true
        type: choice
        options:
          - quick
          - standard
          - deep
        default: 'standard'

env:
  FOUNDRY_VERSION: nightly

jobs:
  # ===========================================
  # SLITHER STATIC ANALYSIS
  # ===========================================
  slither:
    name: Slither Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Slither
        run: pip install slither-analyzer

      - name: Run Slither (full)
        run: slither contracts/ --config-file slither.config.json --json slither-full.json --exclude-informational --exclude-low --exclude-optimization

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: slither-full-results
          path: slither-full.json
          retention-days: 30

      - name: Check for critical/high issues
        run: |
          CRITICAL=$(jq '[.results[] | select(.severity == "critical")] | length' slither-full.json)
          HIGH=$(jq '[.results[] | select(.severity == "high")] | length' slither-full.json)
          MEDIUM=$(jq '[.results[] | select(.severity == "medium")] | length' slither-full.json)

          echo "Critical: $CRITICAL, High: $HIGH, Medium: $MEDIUM"

          if [ "$CRITICAL" -gt 0 ] || [ "$HIGH" -gt 0 ]; then
            echo "❌ Critical or High severity issues found!"
            jq '.results[] | select(.severity == "critical" or .severity == "high")' slither-full.json
            exit 1
          fi

  # ===========================================
  # ECHIDNA FUZZING
  # ===========================================
  echidna:
    name: Echidna Fuzzing
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Echidna
        run: |
          # Install Haskell Stack
          curl -sSL https://get.haskellstack.org/ | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

          # Install Echidna
          stack install echidna

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: ${{ env.FOUNDRY_VERSION }}

      - name: Install dependencies
        run: forge install

      - name: Run Echidna on IDRCToken
        run: |
          echidna-test contracts/token/IDRCToken.sol \
            --config echidna.config.yaml \
            --contract IDRCToken \
            --test-mode assertion \
            --seq-len 50 \
            --test-limit 50000 \
            --format text

      - name: Run Echidna on MultisigWallet
        run: |
          echidna-test contracts/multisig/MultisigWallet.sol \
            --config echidna.config.yaml \
            --contract MultisigWallet \
            --test-mode assertion \
            --seq-len 30 \
            --test-limit 50000 \
            --format text

      - name: Run Echidna on BridgeVault
        run: |
          echidna-test contracts/bridge/BridgeVault.sol \
            --config echidna.config.yaml \
            --contract BridgeVault \
            --test-mode assertion \
            --seq-len 30 \
            --test-limit 50000 \
            --format text

  # ===========================================
  # FOUNDRY INVARIANT TESTING
  # ===========================================
  invariant:
    name: Foundry Invariant Testing
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: ${{ env.FOUNDRY_VERSION }}

      - name: Install dependencies
        run: forge install

      - name: Run invariant tests (standard)
        if: github.event.inputs.depth != 'deep'
        run: forge test --invariant-runs 5000 --invariant-depth 100 -vvv

      - name: Run invariant tests (deep)
        if: github.event.inputs.depth == 'deep'
        run: forge test --invariant-runs 20000 --invariant-depth 200 -vvv

  # ===========================================
  # DEPENDENCY VULNERABILITY SCAN
  # ===========================================
  deps-scan:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: ${{ env.FOUNDRY_VERSION }}

      - name: Audit dependencies
        run: |
          # Check for known vulnerable patterns in dependencies
          forge tree --format json > dep-tree.json
          cat dep-tree.json

      - name: Check for outdated dependencies
        run: forge update --dry-run

  # ===========================================
  # CONTAINER SECURITY SCAN
  # ===========================================
  container-scan:
    name: Container Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy on Dockerfiles
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: './docker'
          format: 'sarif'
          output: 'trivy-docker.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-docker.sarif'

  # ===========================================
  # SECRET SCANNING
  # ===========================================
  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run TruffleHog
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: main
          head: HEAD

  # ===========================================
  # GAS OPTIMIZATION CHECK
  # ===========================================
  gas:
    name: Gas Optimization Report
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: ${{ env.FOUNDRY_VERSION }}

      - name: Install dependencies
        run: forge install

      - name: Build with gas report
        run: forge build --gas-report --sizes

      - name: Run tests with gas report
        run: forge test --gas-report -vvv 2>&1 | tail -100

      - name: Upload gas report
        uses: actions/upload-artifact@v4
        with:
          name: gas-report
          path: gas-report.txt
          retention-days: 30

  # ===========================================
  # SECURITY SUMMARY
  # ===========================================
  summary:
    name: Security Summary
    runs-on: ubuntu-latest
    needs: [slither, echidna, invariant, deps-scan, container-scan, secret-scan, gas]
    if: always()
    steps:
      - name: Generate security report
        run: |
          cat > security-report.md << 'EOF'
          # Security Audit Report
          **Date**: $(date -u)
          **Commit**: ${{ github.sha }}

          ## Results Summary

          | Check | Status |
          |-------|--------|
          | Slither Static Analysis | ${{ needs.slither.result }} |
          | Echidna Fuzzing | ${{ needs.echidna.result }} |
          | Invariant Testing | ${{ needs.invariant.result }} |
          | Dependency Scan | ${{ needs.deps-scan.result }} |
          | Container Scan | ${{ needs.container-scan.result }} |
          | Secret Scan | ${{ needs.secret-scan.result }} |
          | Gas Report | ${{ needs.gas.result }} |

          ## Recommendations

          1. Review any failed checks above
          2. Address critical/high severity Slither findings
          3. Investigate any Echidna counterexamples
          4. Ensure invariant tests cover critical properties
          5. Update dependencies with known vulnerabilities
          6. Rotate any exposed secrets
          7. Optimize gas-heavy functions

          EOF

      - name: Upload security report
        uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: security-report.md
          retention-days: 90

      - name: Notify on failure
        if: failure()
        run: |
          curl -X POST ${{ secrets.SLACK_WEBHOOK }} \
            -H 'Content-type: application/json' \
            --data "{\"text\":\"⚠️ Security audit found issues! Check GitHub Actions for details.\"}"