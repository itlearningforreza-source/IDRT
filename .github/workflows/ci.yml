name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  FOUNDRY_VERSION: nightly
  SOLC_VERSION: 0.8.24

jobs:
  # ===========================================
  # SOLIDITY LINTING & FORMATTING
  # ===========================================
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: ${{ env.FOUNDRY_VERSION }}

      - name: Check formatting
        run: forge fmt --check

      - name: Run Solhint
        run: |
          npm install -g solhint@latest
          solhint 'contracts/**/*.sol'

  # ===========================================
  # SOLIDITY COMPILATION
  # ===========================================
  compile:
    name: Compile Contracts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: ${{ env.FOUNDRY_VERSION }}

      - name: Install dependencies
        run: forge install

      - name: Compile
        run: forge build --sizes

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: out/
          retention-days: 7

  # ===========================================
  # UNIT TESTS
  # ===========================================
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: compile
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: ${{ env.FOUNDRY_VERSION }}

      - name: Install dependencies
        run: forge install

      - name: Run tests
        run: forge test -vvv --gas-report

      - name: Run tests with coverage
        run: forge coverage --report debug > coverage.txt

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.txt
          retention-days: 7

  # ===========================================
  # FUZZ TESTING
  # ===========================================
  fuzz:
    name: Fuzz Testing
    runs-on: ubuntu-latest
    needs: compile
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: ${{ env.FOUNDRY_VERSION }}

      - name: Install dependencies
        run: forge install

      - name: Run fuzz tests
        run: forge test --fuzz-runs 10000 -vvv

      - name: Run invariant tests
        run: forge test --invariant-runs 1000 --invariant-depth 50 -vvv

  # ===========================================
  # STATIC ANALYSIS
  # ===========================================
  static-analysis:
    name: Static Analysis (Slither)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Slither
        run: pip install slither-analyzer

      - name: Run Slither
        run: slither contracts/ --config-file slither.config.json --json slither-results.json

      - name: Upload Slither results
        uses: actions/upload-artifact@v4
        with:
          name: slither-results
          path: slither-results.json
          retention-days: 30

      - name: Check for high severity issues
        run: |
          HIGH_COUNT=$(jq '[.results[] | select(.severity == "high")] | length' slither-results.json)
          if [ "$HIGH_COUNT" -gt 0 ]; then
            echo "Found $HIGH_COUNT high severity issues"
            jq '.results[] | select(.severity == "high")' slither-results.json
            exit 1
          fi

  # ===========================================
  # DEPENDENCY CHECK
  # ===========================================
  deps:
    name: Dependency Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: ${{ env.FOUNDRY_VERSION }}

      - name: Check for outdated dependencies
        run: forge update --dry-run

      - name: Verify no vulnerable dependencies
        run: |
          # Check for known vulnerable patterns in dependencies
          forge tree | head -50

  # ===========================================
  # PYTHON TESTS (Off-chain services)
  # ===========================================
  python-test:
    name: Python Services Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          cd services
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov httpx

      - name: Run Python tests
        run: |
          cd services
          pytest tests/ -v --cov=. --cov-report=xml

      - name: Upload Python coverage
        uses: actions/upload-artifact@v4
        with:
          name: python-coverage
          path: services/coverage.xml
          retention-days: 7

  # ===========================================
  # DOCKER BUILD TEST
  # ===========================================
  docker-build:
    name: Docker Build Test
    runs-on: ubuntu-latest
    needs: [compile, test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.api
          push: false
          tags: idrc-api:test
          load: true

      - name: Build Oracle image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.oracle
          push: false
          tags: idrc-oracle:test
          load: true

      - name: Build Bridge image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.bridge
          push: false
          tags: idrc-bridge:test
          load: true

      - name: Build Indexer image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.indexer
          push: false
          tags: idrc-indexer:test
          load: true

  # ===========================================
  # SECURITY SCAN
  # ===========================================
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'

  # ===========================================
  # FINAL STATUS
  # ===========================================
  status:
    name: CI Status
    runs-on: ubuntu-latest
    needs: [lint, compile, test, fuzz, static-analysis, deps, python-test, docker-build, security]
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          if [[ "${{ needs.lint.result }}" != "success" ]] ||
             [[ "${{ needs.compile.result }}" != "success" ]] ||
             [[ "${{ needs.test.result }}" != "success" ]] ||
             [[ "${{ needs.fuzz.result }}" != "success" ]] ||
             [[ "${{ needs.static-analysis.result }}" != "success" ]] ||
             [[ "${{ needs.deps.result }}" != "success" ]] ||
             [[ "${{ needs.python-test.result }}" != "success" ]] ||
             [[ "${{ needs.docker-build.result }}" != "success" ]] ||
             [[ "${{ needs.security.result }}" != "success" ]]; then
            echo "Some jobs failed"
            exit 1
          fi
          echo "All CI checks passed!"