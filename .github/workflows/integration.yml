name: Integration Tests

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Test environment'
        required: true
        type: choice
        options:
          - sepolia
          - amoy
          - local
  push:
    branches: [main]
    paths:
      - 'script/**'
      - 'test/**'

env:
  FOUNDRY_VERSION: nightly

jobs:
  # ===========================================
  # LOCAL INTEGRATION TESTS (Anvil)
  # ===========================================
  local-integration:
    name: Local Integration (Anvil)
    runs-on: ubuntu-latest
    if: github.event.inputs.environment == 'local' || github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: ${{ env.FOUNDRY_VERSION }}

      - name: Install dependencies
        run: forge install

      - name: Start Anvil
        run: |
          anvil --host 0.0.0.0 --port 8545 --chain-id 31337 --block-time 1 &
          echo "ANVIL_PID=$!" >> $GITHUB_ENV
          sleep 5

      - name: Deploy contracts locally
        run: |
          forge script script/DeployIDRC.s.sol \
            --rpc-url http://localhost:8545 \
            --private-key 0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80 \
            --broadcast \
            -vvv

      - name: Run integration tests
        run: |
          forge test --match-contract IntegrationTest -vvv

      - name: Run fork tests
        run: |
          forge test --fork-url http://localhost:8545 --match-contract ForkTest -vvv

      - name: Kill Anvil
        if: always()
        run: kill ${{ env.ANVIL_PID }}

  # ===========================================
  # TESTNET INTEGRATION TESTS
  # ===========================================
  testnet-integration:
    name: Testnet Integration
    runs-on: ubuntu-latest
    if: github.event.inputs.environment != 'local'
    environment: testnet
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: ${{ env.FOUNDRY_VERSION }}

      - name: Install dependencies
        run: forge install

      - name: Load environment
        run: |
          source .env.${{ github.event.inputs.environment }}
          echo "RPC_URL=${RPC_URL}" >> $GITHUB_ENV

      - name: Run integration tests against testnet
        run: |
          forge test --match-contract IntegrationTest \
            --fork-url ${{ env.RPC_URL }} \
            -vvv

      - name: Run fork tests against testnet
        run: |
          forge test --fork-url ${{ env.RPC_URL }} \
            --match-contract ForkTest \
            -vvv

  # ===========================================
  # END-TO-END TESTS
  # ===========================================
  e2e:
    name: End-to-End Tests
    runs-on: ubuntu-latest
    needs: [local-integration, testnet-integration]
    if: always() && (needs.local-integration.result == 'success' || needs.testnet-integration.result == 'success')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          cd services
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Start local services (docker-compose)
        if: github.event.inputs.environment == 'local' || github.event_name == 'push'
        run: |
          cd docker
          docker-compose up -d postgres redis
          sleep 10

      - name: Run API integration tests
        run: |
          cd services
          pytest tests/integration/test_api.py -v

      - name: Run oracle integration tests
        run: |
          cd services
          pytest tests/integration/test_oracle.py -v

      - name: Run bridge integration tests
        run: |
          cd services
          pytest tests/integration/test_bridge.py -v

      - name: Run indexer integration tests
        run: |
          cd services
          pytest tests/integration/test_indexer.py -v

      - name: Stop local services
        if: always()
        run: |
          cd docker
          docker-compose down

  # ===========================================
  # LOAD TESTING
  # ===========================================
  load-test:
    name: Load Testing
    runs-on: ubuntu-latest
    if: github.event.inputs.environment == 'local' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install k6

      - name: Run load test
        run: |
          k6 run --vus 50 --duration 60s tests/load/api-load-test.js

      - name: Upload load test results
        uses: actions/upload-artifact@v4
        with:
          name: load-test-results
          path: load-test-results.json
          retention-days: 30

  # ===========================================
  # CHAOS ENGINEERING
  # ===========================================
  chaos:
    name: Chaos Engineering
    runs-on: ubuntu-latest
    if: github.event.inputs.environment == 'local'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run chaos experiments
        run: |
          # Test resilience to network partitions, node failures, etc.
          echo "Chaos experiments would run here"
          # Example: docker kill postgres, test failover
          # Example: network latency injection

  # ===========================================
  # INTEGRATION SUMMARY
  # ===========================================
  summary:
    name: Integration Test Summary
    runs-on: ubuntu-latest
    needs: [local-integration, testnet-integration, e2e, load-test, chaos]
    if: always()
    steps:
      - name: Generate integration report
        run: |
          cat > integration-report.md << 'EOF'
          # Integration Test Report
          **Date**: $(date -u)
          **Environment**: ${{ github.event.inputs.environment }}

          ## Results

          | Test Suite | Status |
          |------------|--------|
          | Local Integration | ${{ needs.local-integration.result }} |
          | Testnet Integration | ${{ needs.testnet-integration.result }} |
          | End-to-End | ${{ needs.e2e.result }} |
          | Load Testing | ${{ needs.load-test.result }} |
          | Chaos Engineering | ${{ needs.chaos.result }} |

          EOF

      - name: Upload integration report
        uses: actions/upload-artifact@v4
        with:
          name: integration-report
          path: integration-report.md
          retention-days: 30