name: Bug Report
description: Report a correctness or logic error in the IDRC simulation
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!
        Please be as specific as possible, especially for financial logic issues.

  - type: input
    id: version
    attributes:
      label: IDRC Version
      description: Output of `python -c "import idrc; print(idrc.__version__)"`
      placeholder: "1.0.0"
    validations:
      required: true

  - type: input
    id: python-version
    attributes:
      label: Python Version
      description: Output of `python --version`
      placeholder: "3.12.0"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: "Describe the unexpected behaviour."
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Minimal code snippet or test case that demonstrates the bug.
      render: python
      placeholder: |
        from idrc import IDRCToken
        token = IDRCToken()
        token.initialize(...)
        # ... steps that produce the bug
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behaviour
      description: What should happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behaviour
      description: What actually happens? Include the full traceback.
      render: shell
    validations:
      required: true

  - type: dropdown
    id: affected-module
    attributes:
      label: Affected Module
      multiple: true
      options:
        - idrc.token
        - idrc.erc20
        - idrc.access_control
        - idrc.reserve
        - idrc.proxy
        - idrc.multisig
        - idrc.bridge
        - idrc.monitor
        - idrc.deploy
        - idrc.exceptions
        - tests
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I have searched existing issues and this is not a duplicate.
          required: true
        - label: I have tested this on the latest version.
          required: true
