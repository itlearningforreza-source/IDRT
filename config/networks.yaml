# Default network for deployment
default_network: "sepolia"

# Bridge configuration
bridge:
  supported_chains:
    - ethereum
    - polygon
    - bsc
    - arbitrum
    - optimism
    - base
  relayer:
    poll_interval_seconds: 30
    max_retries: 3
    gas_limit: 500000