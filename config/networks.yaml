# IDRC Network Configuration
# All RPC URLs and API keys should be set via environment variables

networks:
  # Ethereum
  ethereum:
    mainnet:
      chain_id: 1
      name: "Ethereum Mainnet"
      rpc_url: "${ETHEREUM_MAINNET_RPC_URL}"
      explorer_url: "https://etherscan.io"
      api_key: "${ETHERSCAN_API_KEY}"
      native_currency: "ETH"
      block_time: 12
      confirmation_blocks: 3
      contracts:
        idrc_token: ""
        multisig: ""
        reserve: ""
        bridge_vault: ""
        bridge_relayer: ""
        proxy_admin: ""
      gas:
        max_fee_per_gas_gwei: 100
        max_priority_fee_gwei: 2

    sepolia:
      chain_id: 11155111
      name: "Ethereum Sepolia"
      rpc_url: "${ETHEREUM_SEPOLIA_RPC_URL}"
