apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: idrc

resources:
  - ../../base
  - hpa-api.yaml
  - hpa-bridge.yaml
  - poddisruptionbudget.yaml
  - networkpolicy.yaml

namePrefix: prod-

commonLabels:
  environment: production

patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: idrc-api
      spec:
        replicas: 5
        template:
          spec:
            containers:
              - name: api
                env:
                  - name: LOG_LEVEL
                    value: "warning"
                  - name: WORKERS
                    value: "8"
                resources:
                  requests:
                    cpu: "1500m"
                    memory: "2Gi"
                  limits:
                    cpu: "3000m"
                    memory: "4Gi"
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: idrc-oracle
      spec:
        template:
          spec:
            containers:
              - name: oracle
                resources:
                  requests:
                    cpu: "500m"
                    memory: "512Mi"
                  limits:
                    cpu: "1000m"
                    memory: "1Gi"
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: idrc-bridge
      spec:
        replicas: 3
        template:
          spec:
            containers:
              - name: bridge
                resources:
                  requests:
                    cpu: "1000m"
                    memory: "1Gi"
                  limits:
                    cpu: "2000m"
                    memory: "2Gi"
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: idrc-indexer
      spec:
        template:
          spec:
            containers:
              - name: indexer
                resources:
                  requests:
                    cpu: "2000m"
                    memory: "4Gi"
                  limits:
                    cpu: "4000m"
                    memory: "8Gi"

images:
  - name: idrc/api
    newTag: v1.0.0
  - name: idrc/oracle
    newTag: v1.0.0
  - name: idrc/bridge
    newTag: v1.0.0
  - name: idrc/indexer
    newTag: v1.0.0