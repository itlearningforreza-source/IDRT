apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: idrc-api-network-policy
  namespace: idrc
spec:
  podSelector:
    matchLabels:
      app: prod-idrc-api
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: ingress-nginx
        - podSelector:
            matchLabels:
              app: prod-idrc-api
      ports:
        - protocol: TCP
          port: 8000
        - protocol: TCP
          port: 8001
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: postgres
        ports:
          - protocol: TCP
            port: 5432
    - to:
        - podSelector:
            matchLabels:
              app: redis
        ports:
          - protocol: TCP
            port: 6379
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 80
    - to:
        - namespaceSelector:
            matchLabels:
              name: kube-system
        ports:
          - protocol: TCP
            port: 53
          - protocol: UDP
            port: 53
---
