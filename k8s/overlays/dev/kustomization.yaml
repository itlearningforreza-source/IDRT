apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: idrc-dev

resources:
  - ../../base

namePrefix: dev-

commonLabels:
  environment: development

patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: idrc-api
      spec:
        replicas: 1
        template:
          spec:
            containers:
              - name: api
                env:
                  - name: LOG_LEVEL
                    value: "debug"
                  - name: WORKERS
                    value: "2"
                resources:
                  requests:
                    cpu: "250m"
                    memory: "256Mi"
                  limits:
                    cpu: "500m"
                    memory: "512Mi"
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: idrc-oracle
      spec:
        replicas: 1
        template:
          spec:
            containers:
              - name: oracle
                resources:
                  requests:
                    cpu: "100m"
                    memory: "128Mi"
                  limits:
                    cpu: "250m"
                    memory: "256Mi"
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: idrc-bridge
      spec:
        replicas: 1
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: idrc-indexer
      spec:
        replicas: 1
        template:
          spec:
            containers:
              - name: indexer
                resources:
                  requests:
                    cpu: "250m"
                    memory: "512Mi"
                  limits:
                    cpu: "500m"
                    memory: "1Gi"

images:
  - name: idrc/api
    newTag: dev
  - name: idrc/oracle
    newTag: dev
  - name: idrc/bridge
    newTag: dev
  - name: idrc/indexer
    newTag: dev