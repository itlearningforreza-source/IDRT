apiVersion: v1
kind: Secret
metadata:
  name: idrc-secrets
  namespace: idrc
type: Opaque
stringData:
  # Database
  POSTGRES_USER: "idrc_admin"
  POSTGRES_PASSWORD: "CHANGE_ME"
  DATABASE_URL: "postgresql+asyncpg://idrc_admin:CHANGE_ME@postgres:5432/idrc"

  # Redis
  REDIS_PASSWORD: "CHANGE_ME"
  REDIS_URL: "redis://:CHANGE_ME@redis:6379/0"

  # JWT
  JWT_SECRET_KEY: "CHANGE_ME_32_BYTE_HEX"
  JWT_ALGORITHM: "HS256"
  JWT_ACCESS_TOKEN_EXPIRE_MINUTES: "30"
  JWT_REFRESH_TOKEN_EXPIRE_DAYS: "7"

  # Blockchain RPCs
  MAINNET_RPC_URL: "https://eth-mainnet.g.alchemy.com/v2/CHANGE_ME"
  POLYGON_RPC_URL: "https://polygon-mainnet.g.alchemy.com/v2/CHANGE_ME"
  ARBITRUM_RPC_URL: "https://arb-mainnet.g.alchemy.com/v2/CHANGE_ME"
  OPTIMISM_RPC_URL: "https://opt-mainnet.g.alchemy.com/v2/CHANGE_ME"
  BASE_RPC_URL: "https://base-mainnet.g.alchemy.com/v2/CHANGE_ME"

  # Contract Addresses (Mainnet)
  MAINNET_TOKEN_ADDRESS: "0x0000000000000000000000000000000000000000"
  MAINNET_MULTISIG_ADDRESS: "0x0000000000000000000000000000000000000000"
  MAINNET_RESERVE_ADDRESS: "0x0000000000000000000000000000000000000000"
  MAINNET_VAULT_ADDRESS: "0x0000000000000000000000000000000000000000"
  MAINNET_RELAYER_ADDRESS: "0x0000000000000000000000000000000000000000"

  # Oracle
  BANK_API_URL: "https://api.yourbank.com/v1"
  BANK_API_KEY: "CHANGE_ME"
  ORACLE_PRIVATE_KEY: "CHANGE_ME"

  # Bridge
  RELAYER_PRIVATE_KEY: "CHANGE_ME"

  # Monitoring
  SENTRY_DSN: "https://CHANGE_ME@sentry.io/project"
  SLACK_WEBHOOK_URL: "https://hooks.slack.com/services/CHANGE_ME"
  PAGERDUTY_INTEGRATION_KEY: "CHANGE_ME"