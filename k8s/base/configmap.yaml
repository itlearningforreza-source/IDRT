apiVersion: v1
kind: ConfigMap
metadata:
  name: idrc-config
  namespace: idrc
data:
  ENVIRONMENT: "production"
  LOG_LEVEL: "warning"
  LOG_FORMAT: "json"
  WORKERS: "8"
  POLL_INTERVAL: "900"
  DATABASE_POOL_SIZE: "20"
  DATABASE_MAX_OVERFLOW: "10"
  REDIS_MAX_CONNECTIONS: "50"
  RATE_LIMIT_REQUESTS: "200"
  RATE_LIMIT_WINDOW: "60"