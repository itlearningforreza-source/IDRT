apiVersion: apps/v1
kind: Deployment
metadata:
  name: idrc-oracle
  namespace: idrc
  labels:
    app: idrc-oracle
    component: oracle
spec:
  replicas: 1
  selector:
    matchLabels:
      app: idrc-oracle
  template:
    metadata:
      labels:
        app: idrc-oracle
        component: oracle
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: idrc-oracle
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: oracle
          image: idrc/oracle:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: metrics
          envFrom:
            - configMapRef:
                name: idrc-config
            - secretRef:
                name: idrc-secrets
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3