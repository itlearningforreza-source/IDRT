apiVersion: v1
kind: Service
metadata:
  name: idrc-api
  namespace: idrc
  labels:
    app: idrc-api
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: 8000
      protocol: TCP
      name: http
    - port: 8001
      targetPort: 8001
      protocol: TCP
      name: metrics
  selector:
    app: idrc-api