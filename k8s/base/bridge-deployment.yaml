apiVersion: apps/v1
kind: Deployment
metadata:
  name: idrc-bridge
  namespace: idrc
  labels:
    app: idrc-bridge
    component: bridge
spec:
  replicas: 2
  selector:
    matchLabels:
      app: idrc-bridge
  template:
    metadata:
      labels:
        app: idrc-bridge
        component: bridge
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: idrc-bridge
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: bridge
          image: idrc/bridge:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: metrics
          envFrom:
            - configMapRef:
                name: idrc-config
            - secretRef:
                name: idrc-secrets
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3