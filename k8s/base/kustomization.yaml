apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: idrc

resources:
  - namespace.yaml
  - configmap.yaml
  - secret.yaml
  - rbac.yaml
  - api-deployment.yaml
  - api-service.yaml
  - oracle-deployment.yaml
  - bridge-deployment.yaml
  - indexer-deployment.yaml
  - ingress.yaml

commonLabels:
  app.kubernetes.io/name: idrc
  app.kubernetes.io/part-of: idrc-platform
  app.kubernetes.io/managed-by: kustomize

images:
  - name: idrc/api
    newTag: latest
  - name: idrc/oracle
    newTag: latest
  - name: idrc/bridge
    newTag: latest
  - name: idrc/indexer
    newTag: latest