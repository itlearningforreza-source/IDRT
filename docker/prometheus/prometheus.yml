global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: 'development'
    project: 'idrc'

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'api'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['api:8000']

  - job_name: 'oracle'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['oracle:8080']

  - job_name: 'bridge'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['bridge:8080']

  - job_name: 'indexer'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['indexer:8080']

  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres:5432']

  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['host.docker.internal:9100']

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['host.docker.internal:8080']