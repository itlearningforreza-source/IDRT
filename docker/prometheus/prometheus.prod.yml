global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    environment: 'production'
    project: 'idrc'
    cluster: 'primary'

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

rule_files:
  - '/etc/prometheus/rules/*.yml'

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'api'
    metrics_path: '/metrics'
    scheme: 'http'
    kubernetes_sd_configs:
      - role: endpoints
        namespaces:
          names:
            - idrc-production
    relabel_configs:
      - source_labels: [__meta_kubernetes_service_name, __meta_kubernetes_endpoint_port_name]
        action: keep
        regex: 'api;metrics'
      - source_labels: [__meta_kubernetes_namespace]
        action: replace
        target_label: namespace
      - source_labels: [__meta_kubernetes_service_name]
        action: replace
        target_label: service

  - job_name: 'oracle'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['oracle:8080']

  - job_name: 'bridge'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['bridge:8080']

  - job_name: 'indexer'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['indexer:8080']

  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres:5432']

  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']

  - job_name: 'nginx'
    static_configs:
      - targets: ['nginx:9113']

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['host.docker.internal:9100']

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['host.docker.internal:8080']